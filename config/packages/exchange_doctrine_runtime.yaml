doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
  orm:
    controller_resolver:
      auto_mapping: false
    mappings:
      Exchanging:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Exchanging\Entity'
        alias: Exchanging
      ObjectingEmbeddables:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/vendor/objecting/object/src/Embeddable'
        prefix: 'App\Objecting\Embeddable'
        alias: ObjectingEmbeddables
